<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — Clockless Documentation</title>
<style>
  /* ============================================================
   * Clockless Site-Matched Light Theme
   * Tokens lifted verbatim from the production stylesheet.
   * ============================================================ */

  :root {
    --background: hsl(0, 0%, 100%);
    --foreground: hsl(220, 15%, 15%);
    --primary: hsl(210, 60%, 45%);
    --primary-variant: hsl(200, 50%, 40%);
    --primary-foreground: hsl(0, 0%, 100%);
    --secondary: hsl(220, 10%, 94%);
    --secondary-foreground: hsl(220, 15%, 20%);
    --muted: hsl(220, 10%, 96%);
    --muted-foreground: hsl(220, 10%, 40%);
    --accent: hsl(45, 90%, 50%);
    --accent-foreground: hsl(220, 15%, 10%);
    --border: hsl(220, 10%, 85%);
    --card: hsl(0, 0%, 100%);
    --card-foreground: hsl(220, 15%, 15%);
    --radius: 0.5rem;
    --shadow-elegant: 0 4px 20px -4px hsla(220, 15%, 15%, 0.12);
  }

  /* Reset */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--foreground);
    background: var(--background);
    max-width: 820px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Typography — matches site heading scale */
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--foreground);
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }

  h2 {
    font-size: 1.375rem;
    font-weight: 600;
    color: var(--foreground);
    margin-top: 2.5rem;
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    line-height: 1.3;
  }

  h3 {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--foreground);
    margin-top: 2rem;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }

  h4 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted-foreground);
    margin-top: 1.5rem;
    margin-bottom: 0.375rem;
  }

  p {
    margin-bottom: 1rem;
    color: var(--foreground);
  }

  /* Subtitle / lead text */
  .lead {
    font-size: 1.125rem;
    color: var(--muted-foreground);
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  /* Links — match site accent link style */
  a {
    color: var(--primary);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  a:hover {
    border-bottom-color: var(--primary);
  }

  /* Lists */
  ul, ol {
    margin: 0.5rem 0 1rem 1.5rem;
  }
  li {
    margin-bottom: 0.375rem;
  }
  li::marker {
    color: var(--primary);
  }

  /* Tables — match site card style */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.25rem 0;
    font-size: 0.9375rem;
  }
  th {
    text-align: left;
    font-weight: 600;
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-foreground);
    padding: 0.625rem 0.75rem;
    border-bottom: 2px solid var(--border);
    background: var(--muted);
  }
  td {
    padding: 0.625rem 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td {
    border-bottom: none;
  }

  /* Code */
  code {
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    font-size: 0.875em;
    background: var(--muted);
    color: var(--foreground);
    padding: 0.125em 0.375em;
    border-radius: calc(var(--radius) - 4px);
  }
  pre {
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    overflow-x: auto;
    margin: 1rem 0;
    font-size: 0.875rem;
    line-height: 1.6;
  }
  pre code {
    background: none;
    padding: 0;
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin: 1rem 0;
    box-shadow: var(--shadow-elegant);
  }
  .card h3 {
    margin-top: 0;
    font-size: 1.0625rem;
  }

  /* Blockquote */
  blockquote {
    border-left: 3px solid var(--primary);
    padding: 0.75rem 1.25rem;
    margin: 1.25rem 0;
    background: var(--muted);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--muted-foreground);
    font-style: italic;
  }

  /* Horizontal rule */
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  /* Badge / tag */
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.25em 0.75em;
    border-radius: 9999px;
    background: var(--primary);
    color: var(--primary-foreground);
  }

  /* Header area */
  .doc-header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 2px solid var(--border);
  }
  .doc-header .overline {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }
  .doc-header .meta {
    font-size: 0.8125rem;
    color: var(--muted-foreground);
    margin-top: 0.5rem;
  }

  /* Footer */
  .doc-footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8125rem;
    color: var(--muted-foreground);
  }

  /* Grid for cards */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
    margin: 1.5rem 0;
  }

  /* Print styles */
  @media print {
    body {
      margin: 1in;
      padding: 0;
      max-width: none;
      font-size: 11pt;
      line-height: 1.5;
    }
    a {
      text-decoration: none;
      color: black;
      border-bottom: none;
    }
    nav, .no-print {
      display: none !important;
    }
    .card {
      box-shadow: none;
      border: 1px solid #ccc;
      break-inside: avoid;
    }
    h2, h3 {
      break-after: avoid;
    }
    table {
      font-size: 9pt;
    }
  }
</style>
</head>
<body>

<!-- TEMPLATE: Replace {{TITLE}}, {{OVERLINE}}, {{CONTENT}} -->

<header class="doc-header">
  <div class="overline">Clockless Documentation</div>
  <h1>{{TITLE}}</h1>
  <div class="meta">Clockless v12 &bull; Confidential</div>
</header>

<main>
  {{CONTENT}}
</main>

<footer class="doc-footer">
  Clockless &mdash; v12 Documentation &bull; &copy; 2025&ndash;2026 PromptFluid&reg;

</body>
</html>
