    <script>
      // Break network dependency chain by preloading critical assets in parallel
      (function() {
        var head = document.head;
        // Find and preload main CSS (Vite injects actual hashed filename)
        var links = document.querySelectorAll('link[rel="stylesheet"][href*="index"]');
        links.forEach(function(link) {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'style';
          preload.href = link.href;
          head.insertBefore(preload, head.firstChild);
        });
      })();
    </script>
